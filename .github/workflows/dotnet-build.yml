name: Build .NET Onkyo eISCP Library

on:
  push:
    branches-ignore:
      - trash


jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        continue-on-error: true

      - name: Publish Artifacts (per project)
        if: success()
        shell: bash
        run: |
          mkdir -p build_output
          for csproj in $(find . -name '*.csproj'); do
            projname=$(basename "${csproj%.*}")
            outdir="build_output/$projname"
            mkdir -p "$outdir"
            dotnet publish "$csproj" --configuration Release --output "$outdir"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onkyo-eiscp-dotnet-artifacts
          path: build_output
